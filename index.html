<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Little List — Your to-do list</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> LITTLE LIST</div>
      <span class="header-note">A little more done, every day.</span>
    </header>

    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow"><span aria-hidden="true">✦</span> MAKE SPACE FOR WHAT MATTERS</p>
      <h1 id="page-title">A little less on<br><em>your mind.</em></h1>
      <p class="intro">A simple place for all the things you want to get done.</p>

      <div class="list-card">
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input id="task-input" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" required>
          <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </form>

        <div class="list-heading">
          <h2>Your tasks <span aria-hidden="true">✳</span></h2>
          <span id="task-count" class="task-count" aria-live="polite">0 remaining</span>
        </div>
        <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">✓</div>
          <p>All clear over here.</p>
          <span>Add a task above to get started.</span>
        </div>
      </div>
      <p id="storage-message" class="storage-message" role="status"></p>
      <p class="footer-note"><span aria-hidden="true">✦</span> ONE THING AT A TIME</p>
    </section>
  </main>
</body>
</html>
